name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bsv
          POSTGRES_PASSWORD: bsv_ci_pw
          POSTGRES_DB: bsv1960
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsv -d bsv1960"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://bsv:bsv_ci_pw@localhost:5432/bsv1960
      TEST_DATABASE_URL: postgres://bsv:bsv_ci_pw@localhost:5432/bsv1960
      PAYLOAD_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      CRON_SECRET: ci-only-cron-secret
      PREVIEW_SECRET: ci-only-preview-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4 # Version aus "packageManager" in package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:int
      - run: pnpm build
